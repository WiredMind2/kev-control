[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kev-control"
version = "0.1.0"
description = "Caps Lock armed voice control for Windows, driven by a local Kev"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/kev_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["windows: needs a real Windows desktop"]
